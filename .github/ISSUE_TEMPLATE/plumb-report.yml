name: Plumb report (a miss or a misfire)
description: plumb gave the wrong verdict on your code's design. Tell us, so it can learn from it.
labels: ["plumb"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. plumb improves almost entirely from the cases where it got things *wrong*, so a report like yours is exactly what makes it better. Fill in what you can and skip the rest; a partial report still helps.

        **Privacy:** never paste proprietary code. A redacted or minimal example that keeps the structure is all we need.

        New to plumb? The [soundings](https://github.com/chuckwondo/claude-skills/blob/main/plumb/SKILL.md#the-soundings-grouped-ranked-by-leverage) are the checklist it reviews against, with [worked examples](https://github.com/chuckwondo/claude-skills/blob/main/plumb/EXAMPLES.md). You do not need to read them to file a report: the questions below are in plain language. (Curious how we handle your report? See the [triage protocol](https://github.com/chuckwondo/claude-skills/blob/main/plumb/REFINEMENT.md#triage-protocol-for-a-flagged-signal).)
  - type: textarea
    id: subject
    attributes:
      label: The design, plan, or change you ran plumb on
      description: A redacted or minimal example. The structure, not your real code. A short snippet or a plain-language description both work.
      placeholder: A trimmed snippet, or a plain-language description of the structure you reviewed.
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: What plumb said
      description: The verdict plumb gave. If it found nothing, its output is "Plumb is true."
      placeholder: 'For example: "Plumb is true." when it should have flagged something, or a finding you disagree with.'
    validations:
      required: true
  - type: textarea
    id: true-shape
    attributes:
      label: What plumb should have said
      description: The right call, either the problem it missed or why the finding it gave was wrong.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: What kind of problem is it?
      description: plumb only reviews design and structure. Plain bugs and needless complexity are other tools' jobs, so they are still worth knowing but are not plumb's misses. "Not sure" is fine.
      options:
        - A design or structure problem
        - A plain bug (wrong output, or a crash)
        - Code that is more complex than it needs to be
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: coverage
    attributes:
      label: Did plumb seem to know about this kind of problem? (optional)
      description: Your best guess, or skip this. The [soundings](https://github.com/chuckwondo/claude-skills/blob/main/plumb/SKILL.md#the-soundings-grouped-ranked-by-leverage) are the kinds of problems plumb looks for.
      options:
        - It seems to have no notion of this kind of problem
        - It clearly knows this kind of problem but did not flag my case
        - Not sure, or skip
    validations:
      required: false
  - type: dropdown
    id: how-surfaced
    attributes:
      label: How did this come to light? (optional)
      description: Roughly how far it got before someone caught it. This helps us judge its impact. (GitHub already records who filed this report.)
      options:
        - I saw it right away in plumb's output
        - I noticed it while writing or reading the code
        - A code review or a teammate caught it
        - It caused a real failure (a bug or a failing test)
        - Something else
    validations:
      required: false
