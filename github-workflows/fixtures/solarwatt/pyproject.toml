[project]
name = "solarwatt"
version = "0.3.1"
description = "Estimate rooftop solar panel output from irradiance data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/solarwatt"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
